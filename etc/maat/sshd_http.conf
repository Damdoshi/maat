# MAÂT HTTP DEMONSTRATOR ONLY. Do not enable on public interfaces.
Port 22223
ListenAddress 127.0.0.1
HostKey /etc/maat/ssh_host_ed25519_key
PidFile /run/maat/sshd-http.pid
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthorizedKeysFile none
DenyUsers *
DisableForwarding yes
PermitTTY no
PermitUserEnvironment no
PermitUserRC no
ForceCommand /usr/sbin/maat-http-bridge
LogLevel INFO
